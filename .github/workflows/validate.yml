# The catalog gate: every pull request, and every push to the branch the app
# reads. It is the only thing standing between a submitted row and a plugin the
# desktop app will download, so it is deliberately not a linter.
#
# It checks out TWO repositories and drives the desktop app's own
# `packages/market/` — `parseCatalog`, `classifyPlugin`, `resolveGitSource`,
# `fetchGit`, `isAllowedSource`, `fetchTarball`, `isPluginName` — rather than
# re-implementing any of them here.
#
# That choice is the whole design, and the reason is specific: a gate holding a
# second copy of the catalog rules can only ever drift toward passing. It would
# accept a row the installer refuses (a wasted listing, discovered by users) or,
# far worse, accept a package the installer treats differently. There is no
# version of "keep the two in sync by hand" that survives a year. So the app is
# the single authority on catalog shape and plugin kind, this repo owns only
# what the app cannot see from a catalog — what is INSIDE the plugin — and a
# change to the app's rules shows up here as a red check on the next pull
# request instead of as a silent divergence.
#
# Rows pointing at THIS repository are checked against the working tree, not a
# clone. On a pull request the submitted commit is not on `main` yet, so cloning
# would validate the code already there and pass a submission it never looked
# at. The clone path is exercised only by rows pointing somewhere else, which
# are also the rows required to pin a sha.
#
# The desktop checkout is NOT built and NOT `npm ci`-ed. The modules the gate
# imports depend on nothing but `node:*`, so importing them by path costs one
# checkout and no install; an `npm ci` there would pull an Electron download to
# run a handful of pure functions.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the catalog
        uses: actions/checkout@v4

      # Pinned to a ref, not to a SHA, on purpose: the point of driving the
      # app's modules is to notice when the app's rules move. `main` is what
      # installed clients run.
      - name: Check out the desktop app (for its market modules)
        uses: actions/checkout@v4
        with:
          repository: xxsLuna/deepseek-harness-desktop
          ref: main
          path: .desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The two devDependencies are the gate's own: js-yaml to read a patch
      # layer with the same parser the harness uses for it, and ajv to check the
      # editor-time schema still describes the file it advertises. No plugin may
      # have dependencies; this repo is not a plugin.
      - name: Install the gate's tools
        run: npm ci || npm install

      # Runs with the network: a row pointing at another repository is actually
      # cloned, and an archive row is actually downloaded and verified, exactly
      # as they are on a user's machine.
      - name: Validate the catalog
        run: node scripts/validate-catalog.mjs --desktop .desktop

  # The one required status check. Named so it never changes: a required check
  # that stops existing blocks every pull request forever.
  catalog-valid:
    if: always()
    needs: [catalog]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the gate passed
        run: |
          echo "catalog job result: ${{ needs.catalog.result }}"
          test "${{ needs.catalog.result }}" = "success"

# Cut a release for one plugin: `npm pack` it, publish the tarball as a Release
# asset, and REWRITE its row in index.json with the real digest.
#
# It rewrites rather than printing a hash to paste, and that is the decision
# worth defending. A digest a human copies is a digest a human can copy wrong,
# and a wrong one does not fail here — it fails on a user's machine, at install,
# with an integrity mismatch that looks like an attack. Taking the human out of
# the transcription removes the entire failure class. The hash is still printed,
# for the maintainer reading the log.
#
# It opens a PULL REQUEST rather than pushing to main, and that is the other
# half. Pages serves the default branch, so a push to main IS publication. Going
# through a PR means the same gate that protects a third party's submission also
# verifies our own release — and it verifies it the hard way, by downloading the
# asset GitHub is now serving and hashing those bytes, not the bytes this job
# produced. A truncated or clobbered upload cannot become the served catalog.
#
# Order matters: the release is published BEFORE the PR is opened, because the
# gate on that PR downloads the asset. A draft release would 404 for the gate.
name: release-plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin id (the directory under plugins/, which is also the package name)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `npm pack` reads the plugin manifest's `files` list, which is the
      # authority on what ships. The tag and digest come back through
      # GITHUB_OUTPUT so nothing here re-derives them from a filename.
      - name: Pack the plugin and rewrite its catalog row
        id: pack
        run: node scripts/pack-plugin.mjs --plugin "${{ inputs.plugin }}" --out dist --write

      # Refuse a tag that already exists rather than clobbering it: an existing
      # tag means an installed client may already have verified those bytes, and
      # replacing them under the same version is how a supply chain gets
      # rewritten. Bump the plugin's version instead.
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; bump the plugin's version in its package.json"
            exit 1
          fi
          echo "$TAG is free"

      # Notes and PR body go through files rather than inline arguments: both
      # contain backticks and blank lines, and a shell-quoted multi-line
      # argument is where that kind of text turns into a syntax error nobody
      # notices until a release is half cut.
      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
          FILE: ${{ steps.pack.outputs.tarball }}
          FILENAME: ${{ steps.pack.outputs.filename }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          {
            printf '`%s`\n\n' "$FILENAME"
            printf 'integrity: `%s`\n\n' "$INTEGRITY"
            printf 'Installed through the app plugin marketplace, not with npm.\n'
            printf 'The catalog row is verified against these exact bytes by the `validate` workflow.\n'
          } > notes.md
          gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
          rm notes.md
          echo "published $TAG"

      # The asset is now live, so the gate on this PR can download it. The
      # branch carries only the index.json change — the tarball is not committed.
      - name: Open the catalog PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          BRANCH="release/$TAG"
          {
            printf '`%s` is published. This updates the catalog row tarball URL, version and `sha512` integrity.\n\n' "$TAG"
            printf 'The `validate` check on this pull request downloads the published asset and hashes it, so a green\n'
            printf 'check means the served catalog and the released bytes agree — not merely that this job thought so.\n'
          } > pr-body.md
          git config user.name "Luna"
          git config user.email "xxs.main@gmail.com"
          git switch -c "$BRANCH"
          git add index.json
          git commit -m "Serve $TAG from the catalog"
          git push -u origin "$BRANCH"
          gh pr create --base main --title "Serve $TAG from the catalog" --body-file pr-body.md
          rm pr-body.md
